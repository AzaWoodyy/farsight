# Weekly version updates. The PRs go through "PR checks" like any other: a
# package.json or bun.lock change selects every check, database rebuild included.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      # Minors and patches in one PR; each major gets its own.
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # The runtime is Node 26 (engines, Vercel): its types follow it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore(ci)
    groups:
      github-actions:
        patterns: ["*"]
