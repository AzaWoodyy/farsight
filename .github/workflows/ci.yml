name: PR CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: PR checks
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Metadata and conservative selection
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun test scripts/ci/affected.test.ts
          bun scripts/ci/select.ts
      - if: steps.changes.outputs.any == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      # Direct install measured at 2s; caching the 100MB dependency cache costs more.
      - if: steps.changes.outputs.any == 'true'
        run: bun install --frozen-lockfile
      - if: steps.changes.outputs.build == 'true' || steps.changes.outputs.eval == 'true' || steps.changes.outputs.database == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: snapshot
        with:
          path: .ci-data
          key: snapshot-v1-${{ hashFiles('ci/data.json') }}
      - name: Restore and verify the pinned snapshot
        if: steps.changes.outputs.build == 'true' || steps.changes.outputs.eval == 'true' || steps.changes.outputs.database == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REBUILD: ${{ steps.changes.outputs.database }}
        run: |
          args=()
          if [ "$REBUILD" = true ]; then args+=(--raw); fi
          bun scripts/ci/data.ts "${args[@]}"
      - if: github.event_name == 'push' && steps.snapshot.outputs.cache-hit != 'true' && (steps.changes.outputs.build == 'true' || steps.changes.outputs.eval == 'true' || steps.changes.outputs.database == 'true')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-data
          key: snapshot-v1-${{ hashFiles('ci/data.json') }}
      - name: Rebuild and validate offline when data dependencies change
        if: steps.changes.outputs.database == 'true'
        run: |
          bun run data:build
          bun run data:package --check-only
      # Complete type checking before Next rewrites generated route types.
      - name: Typecheck
        if: steps.changes.outputs.typecheck == 'true'
        run: bun run typecheck --incremental false
      - name: Independent checks (two workers, every status collected)
        if: steps.changes.outputs.any == 'true'
        run: python3 scripts/ci/run.py
