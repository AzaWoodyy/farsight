name: PR CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  # The service container below: a throwaway server, its password is no secret. The app connects as the read-only
  # role of db/roles.sql, the loader and the tests as the owner.
  DATABASE_URL: postgres://farsight_app:ci-app@localhost:5432/postgres
  DATABASE_OWNER_URL: postgres://postgres:postgres@localhost:5432/postgres
  TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/farsight_test

jobs:
  checks:
    name: PR checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Tests, eval and build read Postgres: the same server Neon runs, loaded from the pinned snapshot below.
    services:
      postgres:
        image: postgres:18.7@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_INITDB_ARGS: --locale=C.UTF-8 --encoding=UTF8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --shm-size 1g
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Metadata and conservative selection
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun test scripts/ci/affected.test.ts
          bun scripts/ci/select.ts
      - if: steps.changes.outputs.any == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      # Direct install measured at 2s; caching the 100MB dependency cache costs more.
      - if: steps.changes.outputs.any == 'true'
        run: bun install --frozen-lockfile
      - if: steps.changes.outputs.build == 'true' || steps.changes.outputs.eval == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: snapshot
        with:
          path: .ci-data
          key: snapshot-v1-${{ hashFiles('ci/data.json') }}
      # Postgres is always loaded from the raw data: the database is derived, so the same inputs give the same rows.
      - name: Restore and verify the pinned snapshot
        if: steps.changes.outputs.build == 'true' || steps.changes.outputs.eval == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/ci/data.ts
      - if: github.event_name == 'push' && steps.snapshot.outputs.cache-hit != 'true' && (steps.changes.outputs.build == 'true' || steps.changes.outputs.eval == 'true')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-data
          key: snapshot-v1-${{ hashFiles('ci/data.json') }}
      # The tests need the roles and their own database, never the loaded rows.
      - name: Postgres roles and the test database
        if: steps.changes.outputs.build == 'true' || steps.changes.outputs.eval == 'true' || steps.changes.outputs.test == 'true'
        run: |
          psql "$DATABASE_OWNER_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE farsight_test"
          psql "$DATABASE_OWNER_URL" -v ON_ERROR_STOP=1 -v app_password="'ci-app'" -f db/roles.sql
      # Complete type checking before Next rewrites generated route types.
      - name: Typecheck
        if: steps.changes.outputs.typecheck == 'true'
        run: bun run typecheck --incremental false
      # The pinned summaries cannot be recomputed here: after a DERIVE_VERSION bump they stay at the older, compatible one
      # (db:load --allow-older-summaries, run by scripts/ci/run.py beside the tests).
      - name: Independent checks (two chains, every status collected)
        if: steps.changes.outputs.any == 'true'
        run: python3 scripts/ci/run.py
