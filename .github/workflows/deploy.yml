name: Deploy

# Production deployment of the tip of main with the Vercel CLI: the same
# `vercel deploy --prod` as by hand. Vercel runs the build, so `data:pull`
# downloads the newest data release there with the project's DATA_GITHUB_TOKEN.
#
# Runs after successful CI on main, on demand, and at the end of a successful "Data
# release" run, which passes the tag it published: the build must then have
# picked that tag, or the job fails.
#
# Secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID (docs/deploy.md).

on:
  workflow_run:
    workflows: [PR CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      data-tag:
        description: Data release the build is expected to download
        type: string
        default: ""
    secrets:
      VERCEL_TOKEN:
        required: true
      VERCEL_ORG_ID:
        required: true
      VERCEL_PROJECT_ID:
        required: true

permissions:
  contents: read

jobs:
  production:
    # On demand from another branch: nothing to deploy.
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # One production deployment at a time, in the order they were asked for.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      SITE_URL: https://lolesport.enzoneault.dev
    steps:
      # CI-driven deploys use the validated SHA. A data release/manual call
      # takes the tip of main, rather than rolling back to the ingestion start.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Require successful CI for the exact deployment commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          deploy=true
          if [ -n "$CI_SHA" ]; then
            latest=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
            if [ "$CI_SHA" != "$latest" ]; then deploy=false; fi
          fi
          if [ "$deploy" = true ]; then
            sha=$(git rev-parse HEAD)
            passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&head_sha=$sha&status=success&per_page=1" --jq '.workflow_runs | length')
            if [ "$passed" = 0 ]; then
              echo "::error::No successful PR CI push run for the checked-out commit $sha"
              exit 1
            fi
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

      - name: Deploy to production
        if: steps.current.outputs.deploy == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -o pipefail
          # Fails when the build fails, and returns once the domain points to the new deployment.
          bunx --no-install vercel deploy --prod --yes --logs 2>&1 | tee deploy.log

      - name: Check the data release the build downloaded
        if: steps.current.outputs.deploy == 'true'
        env:
          DATA_TAG: ${{ inputs.data-tag }}
        run: |
          picked=$(grep -Eo 'data:pull: (latest|pinned) release [^:]+' deploy.log | tail -n 1 || true)
          echo "${picked:-data:pull line not found in the build log}" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -n "$DATA_TAG" ] && [ "$picked" != "data:pull: latest release $DATA_TAG" ]; then
            echo "::error::the build did not download $DATA_TAG (is DATA_RELEASE pinned on the Vercel project?)"
            exit 1
          fi

      # The page only: POST /api/ask is behind BotID, which rejects a client without a browser.
      - name: Check the site answers
        if: steps.current.outputs.deploy == 'true'
        run: |
          curl --fail --silent --show-error --location --output /dev/null \
            --retry 5 --retry-delay 10 --retry-all-errors --max-time 30 "$SITE_URL/"
