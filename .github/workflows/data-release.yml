name: Data release

# Weekly ingestion from Leaguepedia, checks, then a `data-YYYYMMDD` release
# holding the compressed SQLite file, the in-game summaries and the manifest.
# `bun run data:pull` (Vercel build) downloads the newest release matching the
# code's schema. A run on a branch other than main publishes a prerelease,
# which data:pull ignores unless DATA_RELEASE pins it.
#
# Cargo tables are fetched in full (about 200 requests). Riot game JSON is
# incremental: the previous release's in-game summaries are restored first;
# every game still without a summary is read from the R2 bucket (R2_* secrets,
# 16 parallel reads, about 6 min for the 28,000 games, outside the wiki budget),
# and only the games R2 does not have are downloaded from the wiki (throttled,
# time-boxed by --riot-budget; a backlog is picked up by the next runs) and
# uploaded to R2.
#
# Only the 4 newest data releases are kept (and the 4 newest prereleases).
#
# On main, a successful release then redeploys production (deploy.yml), whose
# build downloads the release just published. A failed check, publication or
# clean-up skips the deployment.

on:
  workflow_dispatch:
  schedule:
    # Mondays 05:23 UTC: after the weekend's matches.
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: data-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      pinned: ${{ steps.meta.outputs.pinned }}
    env:
      # One request at a time, 3 s apart, cached in data/raw.
      LEAGUEPEDIA_DELAY_MS: "3000"
      LEAGUEPEDIA_USER_AGENT: "farsight/1.0 (+https://farsight.enzoneault.dev; weekly batch ingestion, one request every 3 s)"
      # Minutes of Riot JSON downloads per run (2 games per request, about 1.5 s per game).
      RIOT_BUDGET_MINUTES: "90"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Pick the tag and the previous release
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="data-$(date -u +%Y%m%d)"
          tag="$base"
          n=1
          while gh release view "$tag" >/dev/null 2>&1; do
            n=$((n + 1))
            tag="$base-$n"
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "pinned=$(jq -r .tag ci/data.json)" >> "$GITHUB_OUTPUT"

          previous=$(gh release list --exclude-drafts --exclude-pre-releases --limit 50 --json tagName,publishedAt \
            --jq '[.[] | select(.tagName | startswith("data-"))] | sort_by(.publishedAt) | reverse | .[0].tagName // ""')
          if [ -n "$previous" ]; then
            gh release download "$previous" --pattern manifest.json --dir data/previous
            echo "previous=data/previous/manifest.json" >> "$GITHUB_OUTPUT"

            # Same schema and an in-game asset: restore the summaries so only new games are fetched.
            schema=$(bun -e 'import { SCHEMA_VERSION } from "./scripts/data/scope"; console.log(SCHEMA_VERSION)')
            if jq -e --argjson s "$schema" '.schema_version == $s and .ingame != null' data/previous/manifest.json >/dev/null; then
              gh release download "$previous" --pattern ingame.jsonl.zst --dir data/previous
              mkdir -p data/raw
              zstd -d -q data/previous/ingame.jsonl.zst -o data/raw/ingame.jsonl
              echo "restored $(wc -l < data/raw/ingame.jsonl) in-game summaries from $previous"
            else
              echo "no in-game summaries to restore from $previous: Riot JSON starts from scratch (time-boxed)"
            fi
          fi

      - name: Fetch Leaguepedia, Riot game JSON and Data Dragon
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: bun run data:fetch --riot-budget="$RIOT_BUDGET_MINUTES"

      - name: Build the database
        run: bun run data:build

      - name: Check and package
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          PREVIOUS: ${{ steps.meta.outputs.previous }}
        run: bun run data:package --tag="$TAG" ${PREVIOUS:+--previous="$PREVIOUS"} --out=data/release

      # The agent itself reads the new file (rules level, no LLM key) before anything is published.
      # Closed editions only: a game played since the CI snapshot must not block the release.
      - name: Ask the reference question on the new database
        run: bun run eval --only=worlds-chovy-closed --deterministic --strict

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: data-release
          path: data/release/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: data-release
          path: data/release
      # No checkout, install or build has access to a persisted write token.
      - name: Publish the release and retain the newest snapshots
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
          PINNED: ${{ needs.release.outputs.pinned }}
          PRERELEASE: ${{ github.ref != 'refs/heads/main' }}
          KEEP_RELEASES: "4"
        run: |
          flags=(--latest=false)
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" data/release/lol.sqlite.zst data/release/ingame.jsonl.zst data/release/manifest.json \
            --target "$GITHUB_SHA" \
            --title "Data $TAG" \
            --notes-file data/release/notes.md \
            "${flags[@]}"
          { echo '```json'; cat data/release/manifest.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

          # Same kind of release only; keep the pinned CI snapshot indefinitely.
          gh release list --exclude-drafts --limit 200 --json tagName,publishedAt,isPrerelease \
            --jq "[.[] | select((.tagName | startswith(\"data-\")) and .isPrerelease == $PRERELEASE)] | sort_by(.publishedAt) | reverse | .[$KEEP_RELEASES:] | .[].tagName" |
          while read -r old; do
            if [ "$old" = "$PINNED" ]; then continue; fi
            echo "deleting $old"
            gh release delete "$old" --cleanup-tag --yes
          done

  deploy:
    needs: [release, publish]
    # A branch run publishes a prerelease, which production never reads.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/deploy.yml
    with:
      data-tag: ${{ needs.release.outputs.tag }}
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
